name: Build & Publish rust emscripten-wasm-eh sysroot
on:
  workflow_dispatch:
    inputs:
      emcc_version:
        description: Version of emcc to use
        required: true
      rust_version:
        description: Rust version - a nightly date (YYYY-MM-DD) or a stable release (e.g. 1.85.0)
        required: true

env:
  EMCC_VERSION: ${{ inputs.emcc_version }}
  RUST_VERSION: ${{ inputs.rust_version }}

permissions: {}

jobs:
  pyodide-packages:
    name: Build & Publish rust emscripten-wasm-eh sysroot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 360
    outputs:
      tag: ${{ steps.sanity.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: free up disk space
        run: ./free-disk-space.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.8

      - name: Build Rust sysroot
        run: |
          ./main.sh ${EMCC_VERSION} ${RUST_VERSION}

      - name: Sanity check
        id: sanity
        run: |
          shopt -s nullglob
          archives=(emcc-*.tar.bz2)
          if [ ${#archives[@]} -ne 1 ]; then
            echo "expected exactly one sysroot archive, found: ${archives[*]:-none}"
            exit 1
          fi
          echo "tag=${archives[0]%.tar.bz2}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-emcc-sysroot-${{ github.run_id}}
          path: "*.tar.bz2"
          if-no-files-found: error

  publish:
    name: Publish rust emscripten-wasm-eh sysroot
    runs-on: ubuntu-latest
    needs: [pyodide-packages]
    permissions:
      # For attestations
      id-token: write
      attestations: write
      # For creating a release
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Generate artifact attestation(s)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.tar.bz2"

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "*.tar.bz2"
          tag: ${{ needs.pyodide-packages.outputs.tag }}
          draft: false
          prerelease: false
