name: Build & Publish rust emscripten-wasm-eh sysroot
on:
  workflow_dispatch:
    inputs:
      emcc_version:
        description: Version of emcc to use
        required: true
      rust_version:
        description: Rust version - a nightly date (YYYY-MM-DD) or a stable release (e.g. 1.85.0)
        required: true

env:
  EMCC_VERSION: ${{ inputs.emcc_version }}
  RUST_VERSION: ${{ inputs.rust_version }}

permissions: {}

jobs:
  pyodide-packages:
    name: Build & Publish rust emscripten-wasm-eh sysroot
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 360
    outputs:
      tag: ${{ steps.sanity.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: free up disk space
        run: ./free-disk-space.sh

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12.8

      - name: Build Rust sysroot
        run: |
          ./main.sh ${EMCC_VERSION} ${RUST_VERSION}

      - name: Sanity check
        id: sanity
        run: |
          shopt -s nullglob
          archives=(emcc-*.tar.bz2)
          if [ ${#archives[@]} -ne 1 ]; then
            echo "expected exactly one sysroot archive, found: ${archives[*]:-none}"
            exit 1
          fi
          echo "tag=${archives[0]%.tar.bz2}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-emcc-sysroot-${{ github.run_id}}
          path: "*.tar.bz2"
          if-no-files-found: error

  publish:
    name: Publish rust emscripten-wasm-eh sysroot
    runs-on: ubuntu-latest
    needs: [pyodide-packages]
    permissions:
      # For attestations
      id-token: write
      attestations: write
      # For creating a release
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate artifact attestation(s)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "*.tar.bz2"

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "*.tar.bz2"
          tag: ${{ needs.pyodide-packages.outputs.tag }}
          draft: false
          prerelease: false
